# Baut das Spiel bei jedem Push auf main und veröffentlicht dist/pages auf GitHub Pages.
# Einmalig nötig: Repo-Einstellungen → Pages → Source auf „GitHub Actions“ stellen.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin # das Datum in der Version zeigt das deutsche Datum
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle Historie, sonst zählt die Version immer nur einen Commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node holdem/build-pwa.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
